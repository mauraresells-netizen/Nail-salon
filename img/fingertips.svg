<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbeef0"/><stop offset="1" stop-color="#f2d4d7"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d3c2"/><stop offset="1" stop-color="#e3bda8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- four manicured fingertips, varied nail colours -->
  <g>
    <!-- finger 1 -->
    <g transform="translate(46,150)">
      <rect x="0" y="0" width="56" height="260" rx="28" fill="url(#skin)"/>
      <path d="M28,-22 C12,-14 2,16 2,46 C2,55 14,60 28,60 C42,60 54,55 54,46 C54,16 44,-14 28,-22 Z" fill="#8b3a4a"/>
      <path d="M28,-22 C12,-14 2,16 2,46 C2,55 14,60 28,60 C42,60 54,55 54,46 C54,16 44,-14 28,-22 Z" fill="none" stroke="#d4af6a" stroke-width="1.4"/>
      <ellipse cx="20" cy="8" rx="6" ry="14" fill="#fdf8f5" opacity="0.35"/>
    </g>
    <!-- finger 2 (tallest) -->
    <g transform="translate(122,118)">
      <rect x="0" y="0" width="56" height="290" rx="28" fill="url(#skin)"/>
      <path d="M28,-22 C12,-14 2,16 2,46 C2,55 14,60 28,60 C42,60 54,55 54,46 C54,16 44,-14 28,-22 Z" fill="#d4af6a"/>
      <ellipse cx="20" cy="8" rx="6" ry="14" fill="#fdf8f5" opacity="0.45"/>
    </g>
    <!-- finger 3 -->
    <g transform="translate(198,128)">
      <rect x="0" y="0" width="56" height="285" rx="28" fill="url(#skin)"/>
      <path d="M28,-22 C12,-14 2,16 2,46 C2,55 14,60 28,60 C42,60 54,55 54,46 C54,16 44,-14 28,-22 Z" fill="#8b3a4a"/>
      <ellipse cx="20" cy="8" rx="6" ry="14" fill="#fdf8f5" opacity="0.35"/>
    </g>
    <!-- finger 4 (shortest) -->
    <g transform="translate(274,162)">
      <rect x="0" y="0" width="54" height="250" rx="27" fill="url(#skin)"/>
      <path d="M27,-22 C12,-14 2,16 2,46 C2,55 14,60 27,60 C41,60 53,55 53,46 C53,16 42,-14 27,-22 Z" fill="#f2d4d7"/>
      <path d="M27,-22 C12,-14 2,16 2,46 C2,55 14,60 27,60 C41,60 53,55 53,46 C53,16 42,-14 27,-22 Z" fill="none" stroke="#d4af6a" stroke-width="1.4"/>
      <ellipse cx="19" cy="8" rx="6" ry="14" fill="#fdf8f5" opacity="0.5"/>
    </g>
  </g>
</svg>
