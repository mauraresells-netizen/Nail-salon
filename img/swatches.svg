<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#faf4ee"/>
  <text x="200" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#8b3a4a" font-style="italic" letter-spacing="2">the palette</text>
  <!-- fanned polish swatches -->
  <g transform="translate(200,250)">
    <g transform="rotate(-30)"><rect x="-24" y="-110" width="48" height="150" rx="24" fill="#f2d4d7"/></g>
    <g transform="rotate(-15)"><rect x="-24" y="-110" width="48" height="150" rx="24" fill="#d4af6a"/></g>
    <g transform="rotate(0)"><rect x="-24" y="-110" width="48" height="150" rx="24" fill="#8b3a4a"/></g>
    <g transform="rotate(15)"><rect x="-24" y="-110" width="48" height="150" rx="24" fill="#6f2c39"/></g>
    <g transform="rotate(30)"><rect x="-24" y="-110" width="48" height="150" rx="24" fill="#1a0a0d"/></g>
  </g>
  <circle cx="200" cy="250" r="10" fill="#fdf8f5"/>
  <circle cx="200" cy="250" r="10" fill="none" stroke="#d4af6a" stroke-width="1.4"/>
</svg>
